---
# Lists every place the base image (and Tessera's own image) shows the Bazzite name or logo, and
# pushes the report to the "reports" branch (reports/branding-*.txt).
name: Branding inventory
on:
  workflow_dispatch:
    inputs:
      image:
        description: Image to look inside
        default: ghcr.io/ublue-os/bazzite:stable
  push:
    branches: [main]
    paths: [tools/branding-inventory.sh, .github/workflows/branding-inventory.yml]
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ["${{ inputs.image || 'ghcr.io/ublue-os/bazzite:stable' }}", ghcr.io/herbalchemist/tessera:latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
      - name: Look inside
        run: |
          podman pull -q "${{ matrix.image }}"
          name=$(echo "${{ matrix.image }}" | sed 's#.*/##; s#:#-#')
          echo "NAME=$name" >> $GITHUB_ENV
          podman run --rm -v "$PWD/tools:/t:ro" "${{ matrix.image }}" bash /t/branding-inventory.sh > "/tmp/branding-$name.txt" 2>&1 || true
          wc -l "/tmp/branding-$name.txt"
      - name: Publish to the reports branch
        run: |
          git config --global user.name github-actions; git config --global user.email github-actions@users.noreply.github.com
          for i in 1 2 3 4 5; do
            rm -rf /tmp/rep; git worktree prune
            if git fetch -q origin reports; then git worktree add -q --detach /tmp/rep FETCH_HEAD; else git worktree add -q --orphan -b reports-new /tmp/rep; fi
            mkdir -p /tmp/rep/reports && cp "/tmp/branding-$NAME.txt" /tmp/rep/reports/
            (cd /tmp/rep && git add reports && git commit -qm "branding inventory: $NAME" && git push -q origin HEAD:refs/heads/reports) && exit 0
            sleep $((RANDOM % 10 + 3))
          done
          exit 1
