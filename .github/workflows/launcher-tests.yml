# SPDX-License-Identifier: GPL-3.0-or-later
# On every push and pull request: Tessera's security standards (SECURITY.md) and the main process's
# unit tests and lint. (Ludus's own checks are in ludus-qt.yml.)
name: Launcher tests
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Security standards
        run: node tools/security-check.cjs
  launcher:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Unit tests and lint
        run: |
          npm --prefix system_files/usr/lib/tessera/launcher test
          npm --prefix system_files/usr/lib/tessera/launcher run check
      - name: Joy-Con service tests
        run: python3 -m unittest discover tools/joycons-test
