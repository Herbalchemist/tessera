# Tessera's boot menu: shared by splash.cfg, options.cfg and boot.cfg. Installed in /boot/grub2/tessera
# by tessera-boot-menu.service from /usr/share/tessera/grub. GRUB script, not shell.

# Start a version of the system: $1 is its place in the list of system versions ("0>0" is the
# newest, "0>1" the one before), $2 a mode for this one start (desktop, safe, console) or "".
# The mode is left in GRUB's settings file (grubenv) for tessera-boot-once.service to read and clear.
function tessera_boot {
  set tessera_target="$1"
  export tessera_target
  if [ -n "$2" ]; then
    set tessera_once="$2"
    save_env -f "${tessera_env}" tessera_once
  fi
  configfile "${prefix}/tessera/boot.cfg"
}
