# Tessera's boot menu: the functions behind its entries. Installed in /boot/grub2/tessera by
# tessera-boot-menu.service from /usr/share/tessera/grub. GRUB script, not shell.
#
# Everything happens in GRUB's own menu: the system versions (boot entries, made by blscfg) exist
# only there, because Fedora's GRUB makes each one once, so a menu opened later can't list them.
# The wait screen and Boot options are two looks of that one menu (splash.txt, options.txt).

# A mode for the next start (desktop, safe, console): kept in GRUB's settings file for
# tessera-boot-once.service to read and clear, and shown at the bottom of Boot options. GRUB starts
# nothing by itself after an entry (it unsets the timeout), so Enter on a version starts it.
function tessera_mode {
  set tessera_once="$1"
  save_env -f "${tessera_env}" tessera_once
  set theme="${prefix}/tessera/options-$1.txt"
}

# Show the menu another way: "options" (Boot options), "plain" (GRUB's own look, every entry),
# or "wait" (the wait screen again, no countdown).
function tessera_view {
  if [ "$1" != "options" -a -n "${tessera_once}" ]; then
    # leaving Boot options drops a mode chosen there
    set tessera_once=""
    save_env -f "${tessera_env}" tessera_once
  fi
  if [ "$1" = "options" ]; then
    set theme="${prefix}/tessera/options.txt"
  elif [ "$1" = "plain" ]; then
    # unset, not empty: an empty name is looked up as a theme
    unset theme
  else
    set theme="${prefix}/tessera/splash.txt"
  fi
  set default=0
}
