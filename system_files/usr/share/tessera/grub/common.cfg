# Tessera's boot menu: shared by splash.cfg and options.cfg. Installed in /boot/grub2/tessera by
# tessera-boot-menu.service from /usr/share/tessera/grub. GRUB script, not shell.
#
# The system versions (boot entries, made by blscfg) exist only in GRUB's own menu: Fedora's GRUB
# makes each one once, so a menu opened later (configfile) can't list them again. So the wait
# screen is that menu, dressed (splash.cfg), and Boot options, a menu of its own, hands its choice
# back: it leaves it in GRUB's settings file and closes (normal_exit); back in GRUB's menu,
# tessera_options reads it and starts that version at once.

# In Boot options: $1 is what to start, a place in the list of system versions ("0" is the newest,
# "1" the one before) or "menu" (GRUB's own list, waiting); $2 a mode for this one start
# (desktop, safe, console) or "". The mode stays in GRUB's settings file for
# tessera-boot-once.service to read and clear.
function tessera_boot {
  set tessera_pick="$1"
  save_env -f "${tessera_env}" tessera_pick
  if [ -n "$2" ]; then
    set tessera_once="$2"
    save_env -f "${tessera_env}" tessera_once
  fi
  normal_exit
}

# In GRUB's menu (the wait screen): open Boot options, then carry out its choice.
function tessera_options {
  set tessera_pick=""
  save_env -f "${tessera_env}" tessera_pick
  configfile "${prefix}/tessera/options.cfg"
  load_env -f "${tessera_env}" tessera_pick
  if [ "${tessera_pick}" = "menu" ]; then
    # GRUB's own look (unset, not empty: an empty name is looked up as a theme), and wait
    unset theme
    set timeout_style=menu
    set timeout=-1
  elif [ -n "${tessera_pick}" ]; then
    # (the wait screen's theme stays: starting at once, nothing else is drawn)
    set default="${tessera_pick}"
    set timeout_style=hidden
    set timeout=0
  fi
  set tessera_pick=""
  save_env -f "${tessera_env}" tessera_pick
}
