# Tessera's boot menu, step 1: the wait screen. For three seconds the empty spots of the Tessera
# symbol wait for their tiles (the boot animation places them), then the newest version starts.
# O (or F2) shows Boot options; L chooses the login screen (Opus) for this start; Enter starts.
# Sourced from /boot/grub2/custom.cfg (see /usr/libexec/tessera/boot-menu) into GRUB's own menu,
# where the system versions are; it only runs when the normal choice is the newest version, so the
# automatic fallback after a failed update is untouched.
source "${prefix}/tessera/common.cfg"

# GRUB's settings file: custom.cfg's block works it out
if [ -z "${tessera_env}" ]; then
  set tessera_env="${prefix}/grubenv"
fi
export tessera_env

# Pictures need a graphical screen and fonts. If any of it is missing, GRUB shows these same
# entries as plain text instead, which still works.
insmod all_video
insmod gfxterm
insmod gfxmenu
insmod png
for f in 16 20 28; do loadfont "${prefix}/tessera/fonts/tessera-${f}.pf2"; done
loadfont "${prefix}/tessera/fonts/tessera-bold-28.pf2"
loadfont unicode
set gfxmode=auto
terminal_output gfxterm
set theme="${prefix}/tessera/splash.txt"
export theme

set timeout_style=menu
set timeout=3
set default=0
# The system versions come first in this menu (newest first): Enter, or waiting, starts the newest.
# These are added after them, and shown only in the Boot options look (Up and Down reach them).
# A "this time" entry chooses how the next start goes; Enter on a version then starts it.
menuentry "Boot options" --id tessera-options --hotkey=o {
  tessera_view options
}
menuentry "Boot options " --hotkey=f2 {
  tessera_view options
}
menuentry "Start at the login screen   (Opus)" --id tessera-desktop --hotkey=l {
  tessera_mode desktop
}
menuentry "Start Tessera with safe settings   (this time)" --id tessera-safe {
  tessera_mode safe
}
menuentry "Repair console: text only   (this time)" --id tessera-console {
  tessera_mode console
}
menuentry "GRUB's own menu (other systems too)" --id tessera-plain {
  tessera_view plain
}
if [ "${grub_platform}" = "efi" ]; then
  menuentry "Firmware settings (UEFI)" --id tessera-firmware {
    fwsetup
  }
fi
menuentry "Restart" --id tessera-restart {
  reboot
}
menuentry "Power off" --id tessera-poweroff {
  halt
}
menuentry "Back to the wait screen" --id tessera-back {
  tessera_view wait
}
