# Tessera's boot menu, step 2: Boot options. Starting another way this one time (none of them
# skips a password: Desktop Mode goes through the login screen), the version before
# the last update, every system version, the firmware settings, restart and power off.
# Esc goes back to the wait screen's menu.
source "${prefix}/tessera/common.cfg"
set theme="${prefix}/tessera/options.txt"
set timeout=-1
set default=0

menuentry "Start Tessera" --id tessera-start {
  tessera_boot "0>0" ""
}
menuentry "Start the version before the last update" --id tessera-previous {
  tessera_boot "0>1" ""
}
menuentry "Start at the login screen   (Desktop Mode)" --id tessera-desktop {
  tessera_boot "0>0" desktop
}
menuentry "Start Tessera with safe settings   (this time)" --id tessera-safe {
  tessera_boot "0>0" safe
}
menuentry "Repair console: text only   (this time)" --id tessera-console {
  tessera_boot "0>0" console
}
submenu "All system versions" --id tessera-versions {
  set theme="${prefix}/tessera/options.txt"
  blscfg
}
# GRUB's own full menu, with anything else on this machine (another system, for instance)
menuentry "Full boot menu (other systems too)" --id tessera-full {
  set tessera_plain=1
  export tessera_plain
  configfile "${prefix}/grub.cfg"
}
if [ "${grub_platform}" = "efi" ]; then
  menuentry "Firmware settings (UEFI)" --id tessera-firmware {
    fwsetup
  }
fi
menuentry "Restart" --id tessera-restart {
  reboot
}
menuentry "Power off" --id tessera-poweroff {
  halt
}
