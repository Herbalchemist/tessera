# Tessera's boot menu, step 2: Boot options. Starting another way this one time (none of them
# skips a password: Opus goes through the login screen), the version before
# the last update, every system version, the firmware settings, restart and power off.
# Esc goes back to the wait screen. A choice is handed back to GRUB's menu (see common.cfg).
source "${prefix}/tessera/common.cfg"
set theme="${prefix}/tessera/options.txt"
set timeout=-1
set default=0

menuentry "Start Tessera" --id tessera-start {
  tessera_boot "0" ""
}
menuentry "Start the version before the last update" --id tessera-previous {
  tessera_boot "1" ""
}
menuentry "Start at the login screen   (Opus)" --id tessera-desktop {
  tessera_boot "0" desktop
}
menuentry "Start Tessera with safe settings   (this time)" --id tessera-safe {
  tessera_boot "0" safe
}
menuentry "Repair console: text only   (this time)" --id tessera-console {
  tessera_boot "0" console
}
# Every system version, and anything else on this machine (another system, for instance):
# GRUB's own list, which waits for a choice
menuentry "All versions and other systems" --id tessera-all {
  tessera_boot menu ""
}
if [ "${grub_platform}" = "efi" ]; then
  menuentry "Firmware settings (UEFI)" --id tessera-firmware {
    fwsetup
  }
fi
menuentry "Restart" --id tessera-restart {
  reboot
}
menuentry "Power off" --id tessera-poweroff {
  halt
}
