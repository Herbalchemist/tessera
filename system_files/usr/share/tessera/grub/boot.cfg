# Tessera's boot menu, last step: start the version tessera_boot picked, straight away. The system
# versions are the boot entries (blscfg), newest first, so "0" is the newest and "1" the one before.
# They are listed straight here, not inside a submenu: Fedora's GRUB doesn't follow a default that
# points into a submenu ("0>0") and would wait on a one-line menu instead.
set theme="${prefix}/tessera/blank.txt"
set timeout_style=hidden
set timeout=0
set default="${tessera_target}"
blscfg
