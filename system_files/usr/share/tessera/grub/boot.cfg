# Tessera's boot menu, last step: start the version tessera_boot picked, straight away. The system
# versions come from the boot entries (blscfg) inside one submenu, so "0>0" is the newest.
set theme="${prefix}/tessera/blank.txt"
set timeout_style=hidden
set timeout=0
set default="${tessera_target}"
submenu "Tessera" {
  blscfg
}
