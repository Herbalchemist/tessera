# Every boot screen Theme Settings offers goes in the startup image (initramfs), not only the
# default (Tessera's), so whichever was picked (plymouth.splash=, see /usr/libexec/tessera/boot-theme)
# can show from the first moment. The text one (details) is always in there.
install_items+=" $(find /usr/share/plymouth/themes/tessera /usr/share/plymouth/themes/bgrt /usr/share/plymouth/themes/spinner -type f 2>/dev/null | tr '\n' ' ') "
