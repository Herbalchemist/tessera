# Boot options > Repair console: no login screen this start, so the screen shows a text login.
# /run/tessera/console-once is left by tessera-boot-once.service for one start only (/run is emptied
# at every start).
[Unit]
After=tessera-boot-once.service
ConditionPathExists=!/run/tessera/console-once
