<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src data: tessera-art:; frame-src tessera-widget:">
  <title>Tessera</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="hold">
  <header>
    <span class="hint" data-g="4">LB</span>
    <div class="navport"><nav id="tabs"></nav></div>
    <span class="hint" data-g="5">RB</span>
  </header>
  <div id="crumb"></div>
  <main>
    <div class="viewport"><div class="rows" id="rows"></div><div class="canvas" id="canvas" hidden></div></div>
  </main>
  <h1 id="title"></h1>
  <p id="status" role="status"></p>
  <footer>
    <span><b data-g="0">A</b> Open</span>
    <span><b data-g="1">B</b> Back</span>
    <span><b data-g="3">Y</b> Options</span>
    <span><b data-g="4,5">LB / RB</b> Switch tab</span>
  </footer>
  <div id="modal" hidden></div>
  <script src="shell-layout.js"></script>
  <script src="renderer.js"></script>
  <script src="screens.js"></script>
</body>
</html>
