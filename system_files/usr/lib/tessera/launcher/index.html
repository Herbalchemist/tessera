<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'">
  <title>Tessera</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <span class="hint">LB</span>
    <nav id="tabs"></nav>
    <span class="hint">RB</span>
  </header>
  <div id="crumb"></div>
  <main>
    <div class="viewport"><div class="rows" id="rows"></div></div>
  </main>
  <h1 id="title"></h1>
  <p id="status" role="status"></p>
  <footer>
    <span><b>A</b> Open</span>
    <span><b>B</b> Back</span>
    <span><b>Y</b> Options</span>
    <span><b>LB / RB</b> Switch tab</span>
    <span><b>Hold View + Menu</b> Quit</span>
  </footer>
  <div id="modal" hidden></div>
  <script src="renderer.js"></script>
</body>
</html>
