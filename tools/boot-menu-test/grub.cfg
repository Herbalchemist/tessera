# Stand-in for the installed GRUB config (bootupd's static grub.cfg, cut down): environment, a
# menu of two system versions (blscfg is Fedora's; a function stands in for it here), the
# greenboot fallback (test_default), then custom.cfg, the way the real one ends.
set prefix=(hd0,gpt1)/boot/grub2
set root=(hd0,gpt1)
load_env
menuentry_id_option="--id"
set timeout_style=menu
set timeout=1
if [ -n "${test_default}" ]; then set default="${test_default}"; fi
function blscfg {
  menuentry "Tessera 43.20261101.0 (ostree:0)" {
    set tessera_booted=ostree:0
    save_env -f "${prefix}/grubenv" tessera_booted
    echo "BOOTED ostree:0"
    sleep 3600
  }
  menuentry "Tessera 43.20261031.0 (ostree:1)" {
    set tessera_booted=ostree:1
    save_env -f "${prefix}/grubenv" tessera_booted
    echo "BOOTED ostree:1"
    sleep 3600
  }
}
blscfg
if [ -f $prefix/custom.cfg ]; then
  source $prefix/custom.cfg
fi
